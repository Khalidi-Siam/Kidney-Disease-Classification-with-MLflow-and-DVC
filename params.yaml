AUGMENTATION: True
IMAGE_SIZE: [224, 224]        # PyTorch uses H,W (channels handled internally)
BATCH_SIZE: 16
EPOCHS: 30

MODEL_NAME: efficientnet_b0   # options: resnet50, densenet121, efficientnet_b0
PRETRAINED: True

NUM_CLASSES: 1                # binary output (sigmoid/logit)
LOSS_FUNCTION: bcewithlogits  # recommended for binary classification

OPTIMIZER: adam
LEARNING_RATE: 0.0001
WEIGHT_DECAY: 0.00001

TRAIN_SPLIT: 0.7
VAL_SPLIT: 0.15
TEST_SPLIT: 0.15

SEED: 42